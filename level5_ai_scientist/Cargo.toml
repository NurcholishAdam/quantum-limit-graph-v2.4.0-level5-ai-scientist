[package]
name = "quantum-limit-graph-level5-ai-scientist"
version = "2.4.0"
edition = "2021"
authors = ["LIMIT-GRAPH Contributors"]
description = "Level 5 MetaAgent AI Scientist with graph-first world model, validation rails, and quantum-walk exploration"
license = "Apache-2.0"
repository = "https://github.com/yourusername/quantum-limit-graph"
keywords = ["quantum", "ai", "research", "metaagent", "graph"]
categories = ["science", "simulation"]

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
anyhow = "1.0"

# Graph and data structures
petgraph = "0.6"
indexmap = "2.0"

# Quantum simulation
ndarray = "0.15"
num-complex = "0.4"
rand = "0.8"
rand_distr = "0.4"

# Async runtime
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"

# CLI
clap = { version = "4.4", features = ["derive"] }
colored = "2.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Statistics and validation
statrs = "0.16"

# Provenance and versioning
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
git2 = "0.18"

# Schema validation (optional)
jsonschema = { version = "0.17", optional = true }

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"
tempfile = "3.8"

[features]
default = ["schema-validation"]
schema-validation = ["jsonschema"]

[[bin]]
name = "level5-ai-scientist"
path = "src/cli.rs"

[[example]]
name = "demo_cycle"
path = "examples/demo_cycle.rs"

[[bench]]
name = "quantum_walk_bench"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 0
debug = true
